<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Webs By Kamil | Referral Program</title>
    <script>
      // Single-Page-App redirect for GitHub Pages.
      // GitHub Pages has no server-side rewrites, so a direct load of a
      // route like /dashboard returns this 404 page. This script encodes
      // the intended path into the query string and redirects to the real
      // index.html, which restores it before React Router mounts.
      // Based on the well-known spa-github-pages technique.
      var pathSegmentsToKeep = 1; // repo name segment: /webs-by-kamil-referral-platform/
      var l = window.location;
      var newUrl =
        l.protocol +
        "//" +
        l.hostname +
        (l.port ? ":" + l.port : "") +
        l.pathname
          .split("/")
          .slice(0, 1 + pathSegmentsToKeep)
          .join("/") +
        "/?p=/" +
        l.pathname
          .slice(1)
          .split("/")
          .slice(pathSegmentsToKeep)
          .join("/")
          .replace(/&/g, "~and~") +
        (l.search ? "&q=" + l.search.slice(1).replace(/&/g, "~and~") : "") +
        l.hash;
      window.location.replace(newUrl);
    </script>
  </head>
  <body></body>
</html>
