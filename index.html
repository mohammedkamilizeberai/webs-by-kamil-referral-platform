<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Webs By Kamil | Referral Program</title>
    <meta
      name="description"
      content="Refer businesses to Webs By Kamil and track your referrals from your own dashboard. Prototype referral platform."
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- SPA fallback restore: reverses the redirect encoded by public/404.html
         (see spa-github-pages technique) so React Router sees the real path
         the user actually requested, before the app mounts. -->
    <script>
      (function () {
        var l = window.location;
        if (l.search[1] === "p") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            });
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) +
              (decoded[0] || "").slice(2) +
              (decoded[1] ? "?" + decoded[1].slice(2) : "") +
              l.hash
          );
        }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
